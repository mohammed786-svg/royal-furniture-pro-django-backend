upstream royalpro_nextjs {
    server 127.0.0.1:3010;
    keepalive 64;
}

upstream royalpro_daphne_ws {
    server 127.0.0.1:7002;
    keepalive 8;
}

upstream royalpro_gunicorn {
    server 127.0.0.1:4000;
    keepalive 8;
}

# --- HTTP: ACME + redirect to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name royalfurniturepro.azdeploy.com www.royalfurniturepro.azdeploy.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://royalfurniturepro.azdeploy.com$request_uri;
    }
}

# --- HTTPS: www → apex ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.royalfurniturepro.azdeploy.com;

    ssl_certificate     /etc/letsencrypt/live/royalfurniturepro.azdeploy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/royalfurniturepro.azdeploy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://royalfurniturepro.azdeploy.com$request_uri;
}

# --- HTTPS: canonical site ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name royalfurniturepro.azdeploy.com;

    ssl_certificate     /etc/letsencrypt/live/royalfurniturepro.azdeploy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/royalfurniturepro.azdeploy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location /static/ {
        alias /var/www/html/royal_furniture_pro_static/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /var/www/html/royal_furniture_pro_media/;
        access_log off;
        expires 7d;
    }

    location /ws/ {
        proxy_pass http://royalpro_daphne_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /api/ {
        proxy_pass http://royalpro_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://royalpro_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://royalpro_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
