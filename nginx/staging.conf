upstream royal_backend_staging {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name api-staging.royalfurniturepro.com;

    location /media/ {
        include snippets/media.conf;
    }

    location / {
        proxy_pass http://royal_backend_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
