upstream royal_backend {
    least_conn;
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

upstream royal_channels {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    server_name api.royalfurniturepro.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.royalfurniturepro.com;

    include /etc/nginx/snippets/security.conf;

    client_max_body_size 50M;

    location /static/ {
        alias /var/www/royal/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        include /etc/nginx/snippets/media.conf;
    }

    location /ws/ {
        include /etc/nginx/snippets/websocket.conf;
        proxy_pass http://royal_channels;
    }

    location / {
        proxy_pass http://royal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
